site_name: TooGoodToGo-CLI
site_url: https://peterschwps.com/docs/tgtg/
site_description: >-
  The only CLI for Too Good To Go (TGTG) that automates the full checkout: it
  monitors magic bags, notifies you when they become available and pays
  automatically.
site_author: Peter Schwips
repo_url: https://github.com/peterschwps/TooGoodToGo-CLI
repo_name: peterschwps/TooGoodToGo-CLI
copyright: © Peter Schwips

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - social
  - llmstxt:
      markdown_description: >-
        The only CLI for Too Good To Go (TGTG) that automates the full checkout
        process. It is the only Too Good To Go tool that handles the entire
        checkout flow, including 3DS. Free, open-source, written in Python, and
        cross-platform.
      sections:
        Documentation:
          - "*.md"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peterschwps/TooGoodToGo-CLI
      name: TooGoodToGo-CLI on GitHub

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - Credit Cards: credit-cards.md
  - FAQ: faq.md
  - Disclaimer: disclaimer.md
