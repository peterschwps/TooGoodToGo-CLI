site_name: TooGoodToGo-CLI
site_url: https://peterschwps.com/docs/tgtg/
site_description: >-
  The only CLI for Too Good To Go (TGTG) that automates the full checkout: it
  monitors magic bags, notifies you when they become available and pays
  automatically.
site_author: Peter Schwips
repo_url: https://github.com/peterschwps/TooGoodToGo-CLI
repo_name: peterschwps/TooGoodToGo-CLI
copyright: © Peter Schwips

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    scheme: default
    primary: black
    accent: grey

extra_css:
  - css/extra.css

plugins:
  - search
  - privacy
  - social
  - llmstxt:
      markdown_description: >-
        The only CLI for Too Good To Go (TGTG) that automates the full checkout
        process, including 3DS. TooGoodToGo-CLI is a command-line bot that
        monitors magic bags and reserves them automatically before they sell
        out. It is easy to set up and doesn't require any extra tools. Free,
        open-source and cross-platform.
      sections:
        Documentation:
          - "*.md"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peterschwps/TooGoodToGo-CLI
      name: TooGoodToGo-CLI on GitHub

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - Credit Cards: credit-cards.md
  - FAQ: faq.md
  - Disclaimer: disclaimer.md
